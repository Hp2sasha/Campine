<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Campine logo - elegant">
  <!-- Soft shadow / base -->
  <circle cx="40" cy="40" r="36" fill="#17382f"/>
  <circle cx="40" cy="40" r="36" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="2"/>
  
  <!-- Elegant double mountain - more fluid, curved peaks -->
  <path d="M14 48 C18 38, 22 28, 28 20 C30.5 16.5, 32.5 15, 35 19 L38 24 L42 16 C44 12, 46.5 11, 49 16 L54 26 L66 48 Z" fill="white" fill-opacity="0.97"/>
  <!-- Snow caps - subtle -->
  <path d="M24.5 27 L28 20 L31.5 26 L28 23 Z" fill="white"/>
  <path d="M40.5 22 L42 16 L46 24 L42 20 Z" fill="white"/>
  
  <!-- Tent - origami style, warm terracotta -->
  <path d="M40 32 L18 54 H62 Z" fill="#d96d43"/>
  <path d="M40 32 L26 54 H54 Z" fill="#e88b64"/>
  <!-- Tent detail lines - luxury -->
  <path d="M40 32 V54" stroke="#17382f" stroke-width="1.6" stroke-linecap="round" opacity="0.95"/>
  <path d="M29 42 L40 32 L51 42" stroke="white" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" fill="none"/>
  
  <!-- Compass - luxury thin star -->
  <g transform="translate(40,14)">
    <!-- outer glow -->
    <circle cx="0" cy="0" r="9" fill="white" opacity="0.08"/>
    <g fill="none" stroke="#d96d43" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -8 V8 M-8 0 H8 M-5.6 -5.6 L5.6 5.6 M5.6 -5.6 L-5.6 5.6"/>
      <path d="M0 -8 L1.1 -1.1 L8 0 L1.1 1.1 L0 8 L-1.1 1.1 L-8 0 L-1.1 -1.1 Z" fill="#d96d43" stroke="none"/>
    </g>
    <circle cx="0" cy="0" r="2.2" fill="white" stroke="#d96d43" stroke-width="1"/>
    <circle cx="0" cy="0" r="1" fill="#d96d43"/>
  </g>
  
  <!-- Tiny stars - luxury detail -->
  <g fill="white">
    <circle cx="62" cy="20" r="1.3" opacity="0.95"/>
    <circle cx="18" cy="22" r="1" opacity="0.8"/>
    <circle cx="64" cy="28" r="0.8" opacity="0.6"/>
    <circle cx="16" cy="32" r="0.7" opacity="0.5"/>
  </g>
  
  <!-- Bottom horizon line - elegant -->
  <path d="M18 54 H62" stroke="white" stroke-opacity="0.35" stroke-width="1" stroke-linecap="round"/>
</svg>
