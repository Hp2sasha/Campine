<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Campine - کمپینه">
  <!-- Background circle - deep forest -->
  <circle cx="32" cy="32" r="30" fill="#17382f" />
  <!-- Subtle inner ring -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="white" stroke-opacity="0.12" stroke-width="1.2"/>
  <!-- Mountain / Tent unified shape - negative space concept -->
  <!-- Two peaks merging into tent -->
  <path d="M18 42 L26.5 22 L32 30 L37.5 20 L46 42 Z" fill="white" fill-opacity="0.96"/>
  <!-- Tent cutout - terracotta triangle at base -->
  <path d="M32 30 L22 42 H42 Z" fill="#d96d43"/>
  <!-- Tent door line -->
  <path d="M32 30 V42" stroke="#17382f" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
  <!-- Compass star at top - 8 points -->
  <g transform="translate(32,14)">
    <path d="M0 -6 L1.3 -1.3 L6 0 L1.3 1.3 L0 6 L-1.3 1.3 L-6 0 L-1.3 -1.3 Z" fill="#d96d43"/>
    <circle cx="0" cy="0" r="1.7" fill="white"/>
  </g>
  <!-- Small stars / detail -->
  <circle cx="48" cy="18" r="1.1" fill="white" opacity="0.9"/>
  <circle cx="16" cy="20" r="0.9" fill="white" opacity="0.7"/>
  <circle cx="50" cy="26" r="0.7" fill="white" opacity="0.6"/>
</svg>
